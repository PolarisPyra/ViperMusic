# git-cliff configuration for release notes. Preview locally with `git cliff --latest`.
# Every commit is listed under one group because commits here don't follow a
# conventional-commit prefix style.

[changelog]
header = "# Changelog\n\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | upper_first }}
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | upper_first }}
{% endfor %}
{% endfor %}\
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
commit_parsers = [
    { message = ".*", group = "Changes" },
]
filter_commits = true
tag_pattern = "v[0-9].*"
