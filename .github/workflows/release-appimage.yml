name: Release AppImage

# Builds the Linux AppImage when a version tag (v0.1.0, v0.2.0, ...) is pushed,
# and attaches it to a GitHub release for that tag. Pushes to main don't build.
# Run it by hand from the Actions tab to build without a tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # Build on the oldest Ubuntu runner still available so the AppImage links
    # against an older glibc and runs on newer distributions too.
    runs-on: ubuntu-22.04
    env:
      # linuxdeploy is itself an AppImage; this lets it run without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff needs the full history and tags to build release notes.
          fetch-depth: 0

      - name: Install Viper Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libasound2-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libfuse2 \
            libsmbclient-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set version from tag
        # scripts/release.sh already wrote the tag's version into the repo; this makes a tag pushed
        # without the script build with its own version too.
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      - name: Build AppImage
        run: scripts/build.sh appimage

      - name: Find AppImage
        id: find
        run: |
          path=$(ls target/appimage/*.AppImage | head -n 1)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: viper-appimage
          path: ${{ steps.find.outputs.path }}

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header --output release-notes.md

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.find.outputs.path }}" \
            --title "Viper Music $GITHUB_REF_NAME" \
            --notes-file release-notes.md
