[package]
name = "viper"
version = "0.5.0"
edition = "2021"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui-phosphor = { version = "0.14", features = ["fill"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
single-instance = "0.3.3"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "2"
secrecy = "0.10"
dotenvy = "0.15"
base64 = "0.22"
lofty = "0.25.1"
audex = "0.2"
rayon = "1.12.0"
font-kit = "0.14.3"
notify = "8.2"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all"] }
symphonia = { version = "0.5.5", features = ["all"] }
symphonia-adapter-libopus = "0.2"
discord-rich-presence = "1.1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
md5 = "0.7"
webbrowser = "1"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-std = "1.13"
futures-lite = "2"
libc = "0.2"
mpris-server = "0.10"
pavao = "0.3.1"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
